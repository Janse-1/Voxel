<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Engine | Compiler Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #06070d;
            --panel-bg: #0d0f18;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --border: rgba(59, 130, 246, 0.2);
            --text: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar de la Plataforma */
        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
        }

        .logo-area {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: var(--accent);
        }

        /* Contenedor Principal Splitted */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Panel Izquierdo: Compilador e Inputs */
        .compiler-panel {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            margin: 0;
            color: #fff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        select, input[type="range"], input[type="text"] {
            width: 100%;
            background: #07080d;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"] {
            font-family: monospace;
            color: #3b82f6;
            font-weight: bold;
        }

        /* Pantalla de Consola/Telemetría */
        .console-output {
            min-height: 150px;
            flex: 1;
            background: #040508;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #10b981;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Panel Derecho: Visualizador de Matriz Completa */
        .viewport-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0b0d16 0%, #05060a 100%);
            position: relative;
        }

        canvas {
            max-width: 90%;
            max-height: 85%;
        }

        .viewport-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header class="platform-header">
        <div class="logo-area">
            <div style="width: 8px; height: 8px; background: var(--accent); border-radius: 50%;"></div>
            VOXEL ENGINE // PLATFORM STUDIO
        </div>
        <button class="back-btn" onclick="window.location.href='index.html'">← Exit Studio</button>
    </header>

    <div class="workspace">
        <aside class="compiler-panel">
            <h2 class="panel-title">Equation Compiler</h2>
            
            <div class="form-group">
                <label>Simulation Core Mode</label>
                <select id="mode-selector">
                    <option value="math">Standard Pure Mathematics</option>
                    <option value="integral">Calculus: Volumetric Riemann Integral</option>
                    <option value="photoelectric">Quantum Physics: Photoelectric Emission</option>
                </select>
            </div>

            <div class="form-group">
                <label>Custom Formula Parser (Text Input)</label>
                <input type="text" id="formula-input" value="sin(x) * cos(y)" placeholder="e.g. sin(x) * cos(y)">
            </div>

            <div class="form-group">
                <label>Mathematical Presets (Or Select Mode Above)</label>
                <select id="equation-selector">
                    <option value="wave3d">f(x, y) = sin(x) * cos(y)</option>
                    <option value="cone">f(x, y) = 1 - sqrt(x² + y²)</option>
                    <option value="pulse">f(x, y) = cos(x² - y²)</option>
                    <option value="custom_input">Use Custom Formula Input ↑</option>
                </select>
            </div>

            <div class="form-group">
                <label>Matrix Sampling Resolution</label>
                <select id="resolution-selector">
                    <option value="8">8³ Grid (Draft)</option>
                    <option value="16" selected>16³ Grid (Standard Hardware)</option>
                    <option value="24">24³ Grid (High-Density Push)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Signal Modulation Frequency</label>
                <input type="range" id="freq-modulation" min="0.4" max="2.5" step="0.1" value="1.0">
            </div>

            <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                <label>Pipeline Console Logs</label>
                <div class="console-output" id="console-logs">Initializing core pipeline...</div>
            </div>
        </aside>

        <main class="viewport-panel">
            <div class="viewport-badge">RENDER MODE: VOLUMETRIC_MATRIX</div>
            <canvas id="studio-canvas" width="550" height="480"></canvas>
        </main>
    </div>

    <script>
        const canvas = document.getElementById('studio-canvas');
        const ctx = canvas.getContext('2d');
        const eqSelect = document.getElementById('equation-selector');
        const resSelect = document.getElementById('resolution-selector');
        const freqSlider = document.getElementById('freq-modulation');
        const consoleLogs = document.getElementById('console-logs');

        // Referencias seguras a los nuevos componentes del DOM
        const modeSelector = document.getElementById('mode-selector');
        const formulaInput = document.getElementById('formula-input');

        let tick = 0;

        // Proyección isométrica limpia
        function project(x, y, z) {
            const isoX = (x - y) * Math.cos(Math.PI / 6);
            const isoY = (x + y) * Math.sin(Math.PI / 6) - z;
            return {
                x: canvas.width / 2 + isoX,
                y: canvas.height / 2 + isoY + 20
            };
        }

        // Intérprete y Evaluador Matemático Procedimental Seguro
        function evaluateEquation(equation, cx, cy, freq, t) {
            const mode = modeSelector.value;

            // 1. Intercepción Cuántica: Efecto Fotoeléctrico
            if (mode === 'photoelectric') {
                const threshold = 0.8; 
                // Fenómeno ondulatorio base golpeando la superficie metálica
                const energyWave = Math.sin(cx * freq + t) * Math.cos(cy * freq + t) * 3;
                // Si supera la función de trabajo del metal, los electrones se eyectan (vóxeles suben libremente)
                return energyWave > threshold ? energyWave * 1.8 : 0.1; 
            }

            // 2. Si el usuario seleccionó evaluar la caja de texto directo
            if (equation === 'custom_input') {
                try {
                    let textFormula = formulaInput.value.toLowerCase()
                        .replace(/x/g, `(${cx})`)
                        .replace(/y/g, `(${cy})`)
                        .replace(/sin/g, 'Math.sin')
                        .replace(/cos/g, 'Math.cos')
                        .replace(/sqrt/g, 'Math.sqrt')
                        .replace(/pi/g, 'Math.PI');
                    
                    let evalResult = Function(`return ${textFormula}`)();
                    return isNaN(evalResult) ? 0 : evalResult * freq;
                } catch (e) {
                    return 0; // Protege el render si escribe una fórmula incompleta
                }
            }

            // 3. Ecuaciones Matemáticas por Defecto
            switch (equation) {
                case 'wave3d':
                    return Math.sin(cx * freq + t) * Math.cos(cy * freq + t) * 4;
                case 'cone':
                    const dist = Math.sqrt(cx * cx + cy * cy);
                    return Math.sin(dist * freq - t) * 3;
                case 'pulse':
                    return Math.cos((cx * cx - cy * cy) * 0.2 * freq - t) * 3.5;
                default:
                    return 0;
            }
        }

        // Consola de telemetría avanzada corregida (evita errores de propiedades undefined)
        function logPipeline(equationName, size, extraData = {}) {
            const timestamp = new Date().toLocaleTimeString();
            const mode = modeSelector.value;
            let analyticsText = '';

            // Protección de datos opcionales de entrada
            const volume = extraData.volume !== undefined ? extraData.volume : 0;
            const currentFreq = extraData.freq !== undefined ? extraData.freq : parseFloat(freqSlider.value);

            if (mode === 'integral') {
                analyticsText = `\n[${timestamp}] ANALYTICS: Calculated Volume under Surface: ${volume.toFixed(4)} u³\n` +
                                `[${timestamp}] CALC: Riemann Double Integral [∫∫ f(x,y) dx dy] Concluded.`;
            } else if (mode === 'photoelectric') {
                const h = 6.626e-34; 
                const freqHz = currentFreq * 1.4e14;
                const energy = (h * freqHz * 1e19).toFixed(3); 
                analyticsText = `\n[${timestamp}] QUANTUM: Incident Photon Energy (h*ν): ${energy} eV\n` +
                                `[${timestamp}] STATUS: Electron kinetic discharge verified. Threshold cleared.`;
            } else {
                analyticsText = `\n[${timestamp}] PHYSICS: Wave Propagation Phase: ${(tick % (2 * Math.PI)).toFixed(2)} rad`;
            }

            consoleLogs.innerHTML = `[${timestamp}] COMPILER: Parsing target [${equationName.toUpperCase()}] [MODE: ${mode.toUpperCase()}]\n` +
                                    `[${timestamp}] MEMORY: Allocated ${Math.pow(size, 3)} voxel positions in space.` + 
                                    analyticsText + `\n[${timestamp}] PIPELINE: Direct stream streaming at 60 FPS...`;
        }

        function renderWorkspace() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tick += 0.04;

            const gridSize = parseInt(resSelect.value);
            const freq = parseFloat(freqSlider.value);
            const equation = eqSelect.value;
            const mode = modeSelector.value;

            let volumetricSum = 0; 

            // Renderizado Isométrico de atrás hacia adelante
            for (let x = 0; x < gridSize; x++) {
                for (let y = 0; y < gridSize; y++) {
                    
                    const cx = (x - gridSize / 2) * (12 / gridSize);
                    const cy = (y - gridSize / 2) * (12 / gridSize);
                    
                    let cz = evaluateEquation(equation, cx, cy, freq, tick);

                    if (cz > 0) {
                        volumetricSum += cz * (12 / gridSize) * (12 / gridSize);
                    }

                    const scaleFactor = 240 / gridSize;
                    const pt = project(cx * scaleFactor, cy * scaleFactor, cz * (scaleFactor * 0.4));
                    
                    const radius = Math.max(1.5, (scaleFactor * 0.15) + cz * 0.1);
                    let opacity = Math.max(0.15, Math.min(1, (cz + 5) / 10));

                    // --- MÓDULO INTEGRAL: Proyección de Columnas de Riemann ---
                    if (mode === 'integral') {
                        const basePt = project(cx * scaleFactor, cy * scaleFactor, 0);
                        ctx.beginPath();
                        ctx.moveTo(basePt.x, basePt.y);
                        ctx.lineTo(pt.x, pt.y);
                        ctx.strokeStyle = `rgba(59, 130, 246, ${opacity * 0.25})`;
                        ctx.lineWidth = scaleFactor * 0.4;
                        ctx.stroke();
                    }

                    // --- DIBUJO DEL VÓXEL INDIVIDUAL ---
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                    
                    // Colores temáticos dinámicos según el modo científico
                    let hue = 210 + (cz * 4); 
                    if (mode === 'photoelectric') {
                        hue = 135 + (cz * 12); // Tono Verde Esmeralda Cuántico
                        opacity = cz > 0.3 ? 0.85 : 0.15;
                    } else if (mode === 'integral') {
                        hue = 265 + (cz * 2); // Tono Violeta Matemático de Datos
                    }

                    ctx.fillStyle = `hsla(${hue}, 90%, 55%, ${opacity})`;
                    ctx.fill();
                }
            }

            // Actualización segura y amortiguada del Log en consola para no congelar el navegador
            if (Math.random() < 0.02) { 
                logPipeline(equation, gridSize, { volume: volumetricSum, freq: freq });
            }

            requestAnimationFrame(renderWorkspace);
        }

        // Event listeners globales mapeados limpiamente
        eqSelect.addEventListener('change', () => logPipeline(eqSelect.value, resSelect.value));
        resSelect.addEventListener('change', () => logPipeline(eqSelect.value, resSelect.value));
        freqSlider.addEventListener('input', () => logPipeline(eqSelect.value, resSelect.value));
        modeSelector.addEventListener('change', () => logPipeline(eqSelect.value, resSelect.value));
        formulaInput.addEventListener('input', () => {
            eqSelect.value = 'custom_input'; // Cambia automáticamente el preset al escribir texto libre
            logPipeline('CUSTOM_INPUT', resSelect.value);
        });

        // Lanzar de forma segura la primera ejecución del sistema
        logPipeline(eqSelect.value, resSelect.value, { volume: 0, freq: parseFloat(freqSlider.value) });
        renderWorkspace();
    </script>
</body>
</html>
